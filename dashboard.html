<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My ResTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Dashboard specific styles */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            padding: 2rem 0;
            align-items: start;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .restaurant-card {
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 1.5rem;
        }

        .restaurant-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .rating-stars {
            color: #fbbf24;
            /* Amber 400 */
            font-size: 1.25rem;
        }

        .map-link {
            color: var(--primary);
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .map-link:hover {
            text-decoration: underline;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar glass-card"
        style="position: sticky; top: 0; border-radius: 0; border-left: 0; border-right: 0; border-top: 0;">
        <div class="container nav-content">
            <a href="index.html" class="logo">ResTrack</a>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <span id="user-greeting" style="color: var(--text-muted); font-size: 0.9rem;">Welcome</span>
                <button id="logout-btn" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.9rem;">Log
                    Out</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="dashboard-grid">
            <!-- Sidebar: Add Restaurant Form -->
            <aside>
                <div class="glass-card" style="padding: 1.5rem; position: sticky; top: 100px;">
                    <h2 style="margin-bottom: 1.5rem; font-size: 1.5rem;">Add New Place</h2>
                    <form id="add-restaurant-form">
                        <div class="form-group">
                            <label class="form-label">Restaurant Name</label>
                            <input type="text" id="rest-name" class="form-input" required
                                placeholder="e.g. The Golden Spoon">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Location (Address or City)</label>
                            <input type="text" id="rest-location" class="form-input" required
                                placeholder="e.g. 123 Main St, New York">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Rating</label>
                            <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                                <select id="rest-rating" class="form-input" style="width: auto;">
                                    <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                                    <option value="4">⭐⭐⭐⭐ (4)</option>
                                    <option value="3">⭐⭐⭐ (3)</option>
                                    <option value="2">⭐⭐ (2)</option>
                                    <option value="1">⭐ (1)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Your Review</label>
                            <textarea id="rest-review" class="form-input" rows="4" required
                                placeholder="What did you eat? How was the service?"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%;">Save Memory</button>
                    </form>
                </div>
            </aside>

            <!-- Main Content: Restaurant List -->
            <section>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2>Your Visited Places</h2>
                    <div style="color: var(--text-muted); font-size: 0.9rem;">
                        Total: <span id="total-count">0</span>
                    </div>
                </div>

                <div id="restaurant-list">
                    <!-- Cards will be injected here -->
                    <div class="empty-state">
                        <div style="font-size: 3rem; margin-bottom: 1rem;">🍽️</div>
                        <h3>No restaurants yet</h3>
                        <p>Start adding places you've visited to build your collection.</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
