<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResTrack - Track Your Culinary Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container nav-content">
            <a href="#" class="logo">ResTrack</a>
            <div>
                <button id="nav-login-btn" class="btn btn-outline">Log In</button>
                <button id="nav-signup-btn" class="btn btn-primary" style="margin-left: 10px;">Sign Up</button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">
                Remember Every <br>
                <span>Delicious Moment</span>
            </h1>
            <p class="hero-subtitle">
                Your personal culinary passport. Save restaurants, write reviews, and visualize your gastronomic journey
                on the map.
            </p>
            <button id="hero-cta" class="btn btn-primary" style="font-size: 1.2rem; padding: 1rem 2rem;">
                Start Your Journal
            </button>
        </div>

        <!-- Decorative Background Elements -->
        <div class="floating-element"
            style="position: absolute; top: 20%; left: 10%; width: 60px; height: 60px; background: var(--primary); border-radius: 50%; opacity: 0.2; filter: blur(20px);">
        </div>
        <div class="floating-element"
            style="position: absolute; bottom: 20%; right: 10%; width: 100px; height: 100px; background: var(--accent); border-radius: 50%; opacity: 0.2; filter: blur(30px); animation-delay: 1s;">
        </div>
    </section>

    <!-- Auth Modal -->
    <div id="auth-modal" class="auth-container">
        <div class="auth-box glass-card">
            <!-- Login Form -->
            <form id="login-form">
                <h2 style="margin-bottom: 1.5rem; text-align: center;">Welcome Back</h2>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>
                <p class="auth-switch">
                    Don't have an account? <a id="switch-to-signup">Sign Up</a>
                </p>
            </form>

            <!-- Signup Form (Hidden by default) -->
            <form id="signup-form" class="hidden">
                <h2 style="margin-bottom: 1.5rem; text-align: center;">Create Account</h2>
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
                <p class="auth-switch">
                    Already have an account? <a id="switch-to-login">Log In</a>
                </p>
            </form>

            <button id="close-modal"
                style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.5rem;">&times;</button>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
